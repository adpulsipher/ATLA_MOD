modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="atla_core_logo.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: when Game Stages is installed, requirements can check "stages" and element unlocks
# can be mirrored as stages so FTB Quests / KubeJS etc. can react to them.
[[dependencies.${mod_id}]]
    modId="gamestages"
    mandatory=false
    versionRange="[15,)"
    ordering="NONE"
    side="BOTH"
