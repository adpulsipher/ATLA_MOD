plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// atla_gates compiles against atla_core's classes directly (not its jar): the core jar is
// reobfuscated to SRG names in place, which would break compilation against it.
evaluationDependsOn(':atla-core')
def coreMain = project(':atla-core').sourceSets.main

sourceSets {
    // In-game automated tests (run with `./gradlew :atla-gates:runGameTestServer`).
    // Kept out of the release jar.
    gametest {
        compileClasspath += sourceSets.main.output + coreMain.output
        runtimeClasspath += sourceSets.main.output + coreMain.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        // Every run loads BOTH mods, since atla_gates needs atla_core at runtime.
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                atla_core {
                    source coreMain
                }
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly coreMain.output

    // WorldEdit is NOT needed by the mod at runtime. It is only on the dev/test classpath so the
    // gametests can save real .schem files with WorldEdit's own writer (and so //wand works in runClient).
    // Modrinth version id Wrlqaul6 = WorldEdit 7.2.15 for Forge 1.20.1.
    runtimeOnly fg.deobf("maven.modrinth:worldedit:Wrlqaul6")
    gametestCompileOnly fg.deobf("maven.modrinth:worldedit:Wrlqaul6")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
