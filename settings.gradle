pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'atla-story-mods'

// Two mods that ship as separate jars but are designed to run together:
//   atla-core  -> bending elements, levels, story flags and narrative gates (the "progression brain")
//   atla-gates -> world-side gating: bendable block swaps (schematic_overrides.json) and boundary zones
include 'atla-core'
include 'atla-gates'
